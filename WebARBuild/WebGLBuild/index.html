<!DOCTYPE html>
<html lang="en-us">

<head>

<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

<title>AR Pertanian</title>

<link rel="shortcut icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">

<!-- AFRAME -->
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

<!-- MIND AR -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* ===================== */
/* MIND AR CAMERA */
/* ===================== */

#ar-container{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* ===================== */
/* UNITY */
/* ===================== */

#unity-container{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:10;
    background:transparent !important;
}

#unity-canvas{
    width:100%;
    height:100%;
    background:transparent !important;
}

</style>

</head>

<body>

<!-- ================================================= -->
<!-- MINDAR -->
<!-- ================================================= -->

<div id="ar-container">

<a-scene
    mindar-image="
        imageTargetSrc: targets.mind;
        autoStart: true;
        uiScanning: true;
        uiLoading: true;
    "
    embedded
    color-space="sRGB"
    device-orientation-permission-ui="enabled">

    <a-entity
        id="target0"
        mindar-image-target="targetIndex:0">
    </a-entity>

    <a-entity
        id="target1"
        mindar-image-target="targetIndex:1">
    </a-entity>

    <a-entity
        id="target2"
        mindar-image-target="targetIndex:2">
    </a-entity>

    <a-entity
        id="target3"
        mindar-image-target="targetIndex:3">
    </a-entity>

    <a-camera
        position="0 0 0"
        look-controls="false">
    </a-camera>

</a-scene>

</div>

<!-- ================================================= -->
<!-- UNITY -->
<!-- ================================================= -->

<div id="unity-container">

    <canvas
        id="unity-canvas"
        tabindex="-1">
    </canvas>

    <div id="unity-loading-bar">

        <div id="unity-logo"></div>

        <div id="unity-progress-bar-empty">

            <div id="unity-progress-bar-full"></div>

        </div>

    </div>

    <div id="unity-warning"></div>

</div>

<script>

/* ================================================= */
/* UNITY */
/* ================================================= */

const container =
    document.querySelector("#unity-container");

const canvas =
    document.querySelector("#unity-canvas");

const loadingBar =
    document.querySelector("#unity-loading-bar");

const progressBarFull =
    document.querySelector("#unity-progress-bar-full");

const warningBanner =
    document.querySelector("#unity-warning");

function unityShowBanner(msg,type)
{
    console.log(msg);
}

var buildUrl = "Build";

var loaderUrl =
    buildUrl +
    "/WebGLBuild.loader.js";

var config =
{
    dataUrl:
        buildUrl +
        "/WebGLBuild.data",

    frameworkUrl:
        buildUrl +
        "/WebGLBuild.framework.js",

    codeUrl:
        buildUrl +
        "/WebGLBuild.wasm",

    streamingAssetsUrl:
        "StreamingAssets",

    companyName:
        "DefaultCompany",

    productName:
        "AR Pertanian",

    productVersion:
        "0.1",

    showBanner:
        unityShowBanner,

    webglContextAttributes:
    {
        alpha: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: true
    }
};

loadingBar.style.display = "block";

var script =
    document.createElement("script");

script.src = loaderUrl;

script.onload = () =>
{
    createUnityInstance(
        canvas,
        config,
        (progress)=>
        {
            progressBarFull.style.width =
                (100 * progress) + "%";
        }
    )
    .then((unityInstance)=>
    {
        window.unityInstance =
            unityInstance;

        canvas.style.background =
            "transparent";

        canvas.style.backgroundColor =
            "transparent";

        console.log(
            "UNITY READY"
        );

        console.log(
            unityInstance.Module.canvas
                .getContext("webgl2")
                .getContextAttributes()
        );

        loadingBar.style.display =
            "none";
    })
    .catch((message)=>
    {
        alert(message);
    });
};

document.body.appendChild(script);

</script>

<script>

/* ================================================= */
/* MINDAR -> UNITY */
/* ================================================= */

window.addEventListener(
    "DOMContentLoaded",
    () =>
{

    const target0 =
        document.querySelector("#target0");

    const target1 =
        document.querySelector("#target1");

    const target2 =
        document.querySelector("#target2");

    const target3 =
        document.querySelector("#target3");

    function sendPlant(name)
    {
        console.log(
            "FOUND : " + name
        );

        if(window.unityInstance)
        {
            window.unityInstance.SendMessage(
                "MindARBridge",
                "OnMarkerFound",
                name
            );
        }
        else
        {
            console.log(
                "UNITY NOT READY"
            );
        }
    }

    target0.addEventListener(
        "targetFound",
        () =>
        {
            sendPlant("Jagung");
        });

    target1.addEventListener(
        "targetFound",
        () =>
        {
            sendPlant("Padi");
        });

    target2.addEventListener(
        "targetFound",
        () =>
        {
            sendPlant("Tebu");
        });

    target3.addEventListener(
        "targetFound",
        () =>
        {
            sendPlant("Singkong");
        });
});

</script>

</body>
</html>
